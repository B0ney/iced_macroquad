[package]
name = "iced_macroquad"
version = "0.1.0"
edition = "2021"

[features]
image = ["iced_widget/image", "iced_tiny_skia/image"]
svg = ["iced_widget/svg", "iced_tiny_skia/svg"]
canvas = ["iced_widget/canvas", "iced_tiny_skia/geometry"]
lazy = ["iced_widget/lazy"]
advanced = ["iced_widget/advanced"]

[dependencies]
iced_core = { git = "https://github.com/B0ney/iced", branch = "micro-iced" }
iced_graphics = { git = "https://github.com/B0ney/iced", branch = "micro-iced" }
iced_widget = { git = "https://github.com/B0ney/iced", branch = "micro-iced" }
iced_runtime = { git = "https://github.com/B0ney/iced", branch = "micro-iced" }
iced_tiny_skia = { git = "https://github.com/B0ney/iced", branch = "micro-iced" }

macroquad = { version = "=0.4.13", default-features = false }
bytemuck = { version = "1.9", features = ["derive"] }
tiny-skia = "0.11.4"
